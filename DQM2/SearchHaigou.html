<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドラゴンクエストモンスターズ2 特殊配合検索</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--card:#fff;--bd:#d9dee6;--mut:#6b7686;--ac:#2b6cb0;--hl:#fff3bf}
@media(prefers-color-scheme:dark){:root{--bg:#141820;--fg:#e6e9ef;--card:#1e2430;--bd:#333c4d;--mut:#98a3b5;--ac:#6aa9ec;--hl:#5a4a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Yu Gothic UI","Meiryo",sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:6px 14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
@media(max-width:600px){.box{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-size:15px}
.opt{grid-column:1/-1;display:flex;gap:16px;align-items:center;font-size:13px;color:var(--mut)}
.opt label{display:inline;margin:0}
.opt button{margin-left:auto;padding:4px 10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
#cnt{margin:10px 2px;color:var(--mut);font-size:13px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}
.nm{cursor:pointer}.nm:hover{color:var(--ac);text-decoration:underline}
.rk{display:inline-block;min-width:22px;text-align:center;font-size:11px;padding:0 4px;margin-left:5px;border-radius:4px;background:var(--bd);color:var(--fg)}
.kd{font-size:11px;color:var(--mut);margin-left:5px}
mark{background:var(--hl);color:inherit;border-radius:2px}
.ch{font-weight:600}
@media(max-width:600px){
.tw{overflow:visible;background:none;border:0}
table,tbody{display:block}thead{display:none}
tr{display:block;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;padding:6px 10px}
td{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;white-space:normal;border:0;padding:2px 0}
td::before{content:attr(data-l);flex:0 0 3.6em;font-size:12px;color:var(--mut)}
}
</style></head><body><main>

const norm=s=>s.normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let mode=2;
const dl=$("dl");dl.innerHTML=[...new Set(M.map(m=>m[1]))].map(n=>`<option value="${esc(n)}">`).join("")+[...kinds].map(n=>`<option value="${esc(n)}">`).join("");
function hit(name,t,ex){for(const s of [name,AL[name]]){if(!s)continue;const n=norm(s);if(ex?n===t:n.includes(t))return true}return false}
function hl(name,terms,ex){
  let h=esc(name);
  for(const t of terms){if(!t)continue;const n=norm(name);const i=n.indexOf(t);
    if(i>=0&&n.length===name.length){h=esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+t.length))+"</mark>"+esc(name.slice(i+t.length));break}}
  return h;
}
function cell(name,terms,ex,child){
  const i=info[name]||info[AL[name]];let s=`<span class="nm${child?" ch":""}" data-n="${esc(name)}">${hl(name,terms,ex)}</span>`;
  if(i)s+=`<span class="rk">${i.r}</span><span class="kd">${i.k}</span>`;
  else if(kinds.has(name))s+=`<span class="kd">（系統）</span>`;
  return s;
}
function run(){
  const ex=$("ex").checked,pt=$("qp").value.split(/[\s　]+/).map(norm).filter(Boolean),ct=norm($("qc").value);
  const rows=mode===2?F:Q;let out=[];
  for(const r of rows){
    const ps=r.slice(1,-1),ch=r[r.length-1];
    if(ct&&!hit(ch,ct,ex))continue;
    if(pt.length){
      if(mode===2){
        const a=pt[0],b=pt[1];
        if(b===undefined){if(!(hit(ps[0],a,ex)||hit(ps[1],a,ex)))continue}
        else if(!((hit(ps[0],a,ex)&&hit(ps[1],b,ex))||(hit(ps[0],b,ex)&&hit(ps[1],a,ex))))continue;
      }else if(!pt.every(t=>ps.some(p=>hit(p,t,ex))))continue;
    }
    out.push(r);
  }
  $("cnt").textContent=`${out.length} 件（全${rows.length}件）`;
  $("tb").innerHTML=out.map(r=>{
    const ps=r.slice(1,-1),ch=r[r.length-1],L=mode===2?["親１","親２"]:["祖父１","祖母１","祖父２","祖母２"];
    return `<tr><td data-l="No">${r[0]}</td>`+ps.map((p,i)=>`<td data-l="${L[i]}">${cell(p,pt,ex,false)}</td>`).join("")+`<td data-l="子">${cell(ch,[ct],ex,true)}</td></tr>`}).join("");
}
function setMode(m){
  mode=m;$("t2").classList.toggle("on",m===2);$("t4").classList.toggle("on",m===4);
  $("lp").textContent=m===2?"親モンスター（スペース区切りで2体まで指定）":"親モンスター（祖父母いずれか。スペース区切りで複数指定＝すべてを含む）";
  $("th").innerHTML="<tr><th>No</th>"+(m===2?"<th>親１</th><th>親２</th>":"<th>祖父１</th><th>祖母１</th><th>祖父２</th><th>祖母２</th>")+"<th>子</th></tr>";
  run();
}
$("t2").onclick=()=>setMode(2);$("t4").onclick=()=>setMode(4);
["qp","qc","ex"].forEach(id=>$(id).addEventListener("input",run));
$("clr").onclick=()=>{$("qp").value="";$("qc").value="";run()};
$("tb").addEventListener("click",e=>{const n=e.target.closest(".nm");if(n){$("qp").value=n.dataset.n;$("qc").value="";$("ex").checked=true;run();scrollTo(0,0)}});
setMode(2);
</script></body></html>
