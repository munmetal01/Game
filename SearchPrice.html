<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>風来のシレン6 アイテム価格検索</title>
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#1f2a33;--sub:#5d6b75;--line:#d3dcdb;--acc:#0f6b62;--bless:#a8690f;--curse:#6b3fa0}
@media (prefers-color-scheme:dark){:root{--bg:#161d21;--panel:#1f282d;--ink:#e6ecea;--sub:#93a3aa;--line:#33424a;--acc:#4fc3b3;--bless:#e5a73e;--curse:#b491e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.35rem;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
fieldset{border:0;margin:0;padding:0}
legend,label.t{font-size:.85rem;color:var(--sub);padding:0;margin-bottom:4px;display:block}
input[type=text],input[type=number],select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,th button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.range{display:flex;gap:6px;align-items:center}
.range span{color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span{display:inline-block;padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;background:var(--bg)}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--panel)}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.note{font-size:.82rem;color:var(--sub);margin:10px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.9rem;color:var(--sub)}
button.reset{font:inherit;padding:4px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;cursor:pointer}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th button{all:unset;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--sub)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td small{color:var(--sub);margin-left:6px}
.st-b{color:var(--bless);font-weight:600}
.st-c{color:var(--curse);font-weight:600}
.empty{padding:28px;text-align:center;color:var(--sub)}
</style>
</head>

<h1>風来のシレン6 アイテム価格検索</h1>

<section class="panel" aria-label="検索条件">
 <div class="grid">

   <legend>アイテム種別</legend>

  <div>

  <div>
   <label class="t" for="sell">売値</label>

  </div>
  <div>

   <input type="text" id="name" placeholder="例: 識別">
  </div>
 </div>
 <p class="note">買値・売値を入力すると、その価格になる「アイテム・状態・回数」の組み合わせをすべて表示します（両方入力した場合は両方に一致するもの）。祝福は草と巻物のみ、回数は杖と壺のみ（0〜<span id="maxc"></span>）が対象です。未入力のときは通常・回数0の基準価格を表示します。</p>
</section>

<div class="bar"><span id="count"></span><button class="reset" id="reset" type="button">条件をリセット</button></div>
<div class="wrap">
<table>

  <th>状態</th>
  <th class="n">回数</th>
  <th class="n"><button data-k="buy" type="button">買値</button></th>
  <th class="n"><button data-k="sell" type="button">売値</button></th>
 </tr></thead>
 <tbody id="rows"></tbody>
</table>
</div>
</main>

const BLESSABLE = new Set(["巻物","草"]);
const MAXC = 15; // 杖・壺の回数の上限（探索範囲）
const STATES = {n:"通常", b:"祝福", c:"呪い"};
const $ = id => document.getElementById(id);
let sortKey = "", sortDir = 1;

$("maxc").textContent = MAXC;
$("types").innerHTML = TYPES.map(t =>
  `<label><input type="checkbox" value="${t}" checked><span>${t}</span></label>`).join("");

function variants(it){
  const out = [];
  const counts = COUNTED.has(it.type) ? Array.from({length:MAXC+1}, (_, i) => i) : [null];
  const states = BLESSABLE.has(it.type) ? ["n","b","c"] : ["n","c"];
  for (const c of counts) for (const st of states) {
    let b = it.buy, s = it.sell;
    if (c !== null) { b += 100*c; s += 40*c; }
    if (st === "b") { b *= 2; s *= 2; }
    if (st === "c") { b = Math.floor(b*0.87); s = Math.floor(s*0.87); }
    out.push({type:it.type, name:it.name, st, c, b, s});
  }
  return out;
}
const ALL = DATA.flatMap(variants);
const num = id => { const v = $(id).value; return v === "" ? null : Number(v); };

function render(){
  const types = [...document.querySelectorAll("#types input:checked")].map(e => e.value);
  const q = $("name").value.trim();
  const buy = num("buy"), sell = num("sell");
  const priced = buy !== null || sell !== null;
  let list = ALL.filter(v =>
    types.includes(v.type) &&
    (!q || v.name.includes(q)) &&
    (priced ? (buy === null || v.b === buy) && (sell === null || v.s === sell)
            : v.st === "n" && (v.c === null || v.c === 0)));
  if (sortKey) {
    const key = {type:"type", name:"name", buy:"b", sell:"s"}[sortKey];
    list = list.slice().sort((x,y) => (x[key] > y[key] ? 1 : x[key] < y[key] ? -1 : 0) * sortDir);
  }
  $("rows").innerHTML = list.length ? list.map(v => {
    const cls = v.st === "b" ? "st-b" : v.st === "c" ? "st-c" : "";
    return `<tr><td>${v.type}</td><td>${v.name}</td><td class="${cls}">${STATES[v.st]}</td><td class="n">${v.c === null ? "－" : v.c}</td><td class="n">${v.b.toLocaleString()}</td><td class="n">${v.s.toLocaleString()}</td></tr>`;
  }).join("") : `<tr><td colspan="6" class="empty">条件に合うアイテムがありません。価格を確認してください。</td></tr>`;
  $("count").textContent = `${list.length} 件`;
}

document.querySelectorAll("th button").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.k;
  sortDir = (sortKey === k) ? -sortDir : 1;
  sortKey = k; render();
}));
$("reset").addEventListener("click", () => {
  document.querySelectorAll("#types input").forEach(e => e.checked = true);
  ["name","buy","sell"].forEach(id => $(id).value = "");
  sortKey = ""; sortDir = 1; render();
});
render();
</script>
